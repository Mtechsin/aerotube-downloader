name: Bug report
description: Something is broken in AeroTube. Prefer in-app Report a Bug so diagnostics attach automatically.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Fastest path:** open AeroTube → **Settings → Report a Bug**, describe the issue, then **Open GitHub**.
        That flow attaches a sanitized environment snapshot and log tail automatically.

        If you report here manually, please fill every section you can — incomplete reports are hard to act on.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the problem.
      placeholder: Download stops at 99% for every video
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Download failed
        - Search / metadata
        - Playlist
        - Login / cookies
        - Crash / freeze
        - UI / layout
        - Update
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Settings → About, or the version shown when the app starts.
      placeholder: 1.1.0
    validations:
      required: true

  - type: input
    id: ytdlp_version
    attributes:
      label: yt-dlp version
      description: Settings → Tools → yt-dlp (leave blank if unknown).
      placeholder: 2025.01.01

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include a sample URL only if it is public and non-sensitive.
      placeholder: |
        1. Paste a public YouTube video link
        2. Choose Video+Audio → 1080p
        3. Start download
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: File appears in the configured download folder

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Progress freezes at 99%, then "Network connection error"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
      description: |
        Paste the report generated by **Settings → Report a Bug → Copy**, or attach `app.log`.
        Do not paste cookies, tokens, or private playlist URLs. The in-app export already redacts these.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I can reproduce this (or it happened more than once)
          required: false
        - label: I have logging enabled (Settings → Logs)
          required: false
        - label: I did not include cookies, passwords, or private URLs
          required: true
