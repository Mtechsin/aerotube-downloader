# --- JVM Memory Configuration ---
# Using 4GB heap with G1GC for efficient garbage collection.
org.gradle.jvmargs=-Xmx4096M -Xms512M -XX:MaxMetaspaceSize=1024M -XX:ReservedCodeCacheSize=256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Build Parallelism ---
org.gradle.workers.max=1
org.gradle.parallel=false

# --- Gradle Daemon ---
org.gradle.daemon=false

# --- Disable Kotlin Incremental Compilation ---
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# --- Android Configuration ---
android.useAndroidX=true
android.enableJetifier=true

# --- Disable R8 Full Mode ---
android.enableR8.fullMode=false
