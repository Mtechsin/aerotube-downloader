# --- JVM Memory Configuration ---
# Using 2GB heap with G1GC for efficient garbage collection.
org.gradle.jvmargs=-Xmx2048M -Xms512M -XX:MaxMetaspaceSize=384M -XX:ReservedCodeCacheSize=128M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Build Parallelism ---
org.gradle.workers.max=2
org.gradle.parallel=true

# --- Gradle Daemon ---
# Enable daemon for faster subsequent builds.
org.gradle.daemon=true

# --- Kotlin Incremental Compilation ---
# Enable for faster incremental builds.
kotlin.incremental=true

# --- Kotlin Compile Avoidance ---
kotlin.incremental.useClasspathSnapshot=true

# --- Android Configuration ---
android.useAndroidX=true
android.enableJetifier=true

# --- R8 Full Mode ---
android.enableR8.fullMode=true
