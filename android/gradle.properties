org.gradle.jvmargs=-Xmx3072M -Xms256M -XX:MaxMetaspaceSize=512M -XX:ReservedCodeCacheSize=256M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=true
# Disable Kotlin incremental compilation: on Windows, Flutter plugins in Pub Cache
# on C:\ and this project on E:\ have different filesystem roots, which crashes
# Kotlin's RelocatableFileToPathConverter during incremental cache close.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
# AGP 9 requires its built-in Kotlin plugin.
android.builtInKotlin=true
android.newDsl=true
